name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test
      - name: Shell syntax
        run: |
          set -e
          for f in scripts/*.sh templates/scripts/*.sh; do
            bash -n "$f"
          done
      - name: Package contents
        run: npm pack --dry-run
